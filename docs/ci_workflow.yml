name: RiskLens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 1. Backend Pytest & Migrations ─────────────────────────────────────────
  backend-tests:
    name: Backend Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-asyncio

      - name: Verify Alembic Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ─── 2. Frontend Typecheck & Production Build ───────────────────────────────
  frontend-build:
    name: Frontend Typecheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck & Production Build
        run: |
          cd frontend
          npm run build

  # ─── 3. Docker Configuration Validation ──────────────────────────────────────
  docker-validation:
    name: Docker Compose Syntax & Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config --quiet

      - name: Build Docker Images
        run: docker compose build --parallel
